# yt-dlp options, applied to every run — including every run made by ytsave.
# One option per line; lines starting with '#' are comments.
#
# ytsave passes a fixed argument list and offers no way to add flags, so this
# file (read by yt-dlp from the directory of its own executable) is how the
# engine gets configured.

# Node is always available in this project and silences the
# "No supported JavaScript runtime could be found" warning.
--js-runtimes node

# YouTube 403s most datacenter IPs (Render, Vercel, CI), which is what CODY
# runs on. Uncomment one of these to make downloads work from those hosts:
# --cookies /absolute/path/to/cookies.txt
# --proxy http://user:pass@host:port
