services:
  - type: worker
    name: cody-whatsapp-bot
    env: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: SESSION_ID
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: OWNER_NAME
        value: USER
      - key: BOT_NAME
        value: CODY AI
      - key: PREFIX
        value: "."
      - key: MODE
        value: public
      - key: TIMEZONE
        value: Africa/Lagos
